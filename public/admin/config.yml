                  - { label: Heading beside the text, value: split }
              - { name: paragraphs, widget: list, field: { name: text, widget: text } }
              - { name: muted, label: Closing line, widget: text, required: false }
              - { name: caption, label: Caption, widget: text, required: false }
              - { name: headingRule, label: Rule under the heading, widget: boolean, default: false }
