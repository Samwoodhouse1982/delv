# The editing interface for delv.health.
#
# This mirrors src/content.config.ts. The two have to agree: this file decides
# what Sam can type, and that one decides what the build will accept. When a
# block gains a field, it gains it in both, and the build fails until it does.
#
# What is deliberately not here
#
# `nestSplit` is a faithfulness flag, not a design choice — it exists so the
# parity check against the pre-migration build could stay strict. Exposing it
# would be offering a control that changes nothing.
#
# The proof results and the quotes are not here either. They live in
# src/data/proof.ts because the same figure appears on several pages, and a
# number that disagrees with itself across two pages is the precise thing this
# company sells against. A block chooses where proof appears; it cannot choose
# what the proof says.
#
# Neither is the JSON-LD, the navigation, or the form's field names. The field
# names are the contract with api/contact.js, and renaming one from a CMS
# would break the form with no error anywhere.

backend:
  name: github
  repo: Samwoodhouse1982/delv
  branch: main

  # The sign-in relay. It holds the GitHub client secret, which cannot live in
  # a browser, and exchanges the authorisation code for a token. Its source is
  # in cms-auth/ and the three setup steps are in cms-auth/README.md.
  #
  # REPLACE THE SUBDOMAIN with the one `wrangler deploy` prints. Until this is
  # a real URL the editor loads and the sign-in button does nothing.
  base_url: https://delv-cms-auth.CHANGE-ME.workers.dev
  auth_endpoint: auth

  # Every save is a commit. That is the point: edits revert like code does.
  commit_messages:
    update: 'Edit {{collection}} “{{slug}}” from the CMS'

# Sveltia can edit the working copy straight from the browser with no server,
# which is the fastest way to try a change before it is committed anywhere.
local_backend: true

media_folder: public/img
public_folder: /img

# Shown above the editor, so the one thing that is easy to get wrong is said
# before it can be.
site_url: https://delv.health
display_url: https://delv.health
logo_url: /brand/delv-icon.svg

collections:
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: route
    summary: '{{fields.meta.title}}'
    sortable_fields: [order, route]
    fields:
      - { name: route, widget: hidden }
      - { name: order, widget: hidden }

      - name: meta
        label: Search and sharing
        widget: object
        collapsed: true
        fields:
          - name: title
            label: Browser tab and search result title
            widget: string
            hint: The full title, including “delv. ·”.
          - name: description
            label: Search result description
            widget: text
            pattern:
              ['^.{1,165}$', 'Keep it under 165 characters or Google truncates it']
          - name: ogImage
            label: Sharing image
            widget: string
            hint: A filename in public/og/, like /og/home.png.
          - name: noindex
            label: Hide from search engines
            widget: boolean
            default: false

      - name: blocks
        label: Sections
        label_singular: Section
        widget: list
        # Drag to reorder. This is the whole reason the pages became data.
        collapsed: true
        summary: '{{fields.name}}'
        typeKey: type
        types:
          # -------------------------------------------------------- hero
          - name: hero
            label: Hero
            summary: '{{fields.name}}'
            fields:
              # Hidden, not absent. The editor writes back the fields it
              # knows about, so a field it has never heard of is deleted on
              # the first save — silently, with the page only wrong after
              # somebody edits it. These are settings made once during the
              # migration that are not choices worth offering, so they ride
              # along rather than being lost. scripts/cms-schema-parity.mjs
              # fails the moment this list stops matching the schema.
              - { name: band, widget: hidden }
              - { name: headingGap, widget: hidden }
              - { name: nestSplit, widget: hidden }
              - { name: plain, widget: hidden }
              - { name: tight, widget: hidden }
              - { name: name, label: Label in this list, widget: string, required: false }
              - { name: heading, label: Heading, widget: string }
              - name: sub
                label: Standfirst
                widget: list
                # A list, because the home page opens with two paragraphs.
                # A plain text field here would write a string back and the
                # build would reject it.
                field: { name: text, widget: text }
              - name: actions
                label: Buttons
                widget: list
                required: false
                fields:
                  - { name: label, widget: string }
                  - { name: href, label: Goes to, widget: string }
                  - { name: ghost, label: Outline style, widget: boolean, default: false }
              - name: lockup
                label: Two-line lockup
                widget: boolean
                default: false
                hint: Home page only. The heading has its own measured fit.
              - name: tightBottom
                label: Less space underneath
                widget: boolean
                default: false
              # Home page only. This has to be here even though it is not a
              # section of its own: the editor writes back the fields it knows
              # about, so a hero saved without these would lose the before and
              # after demo entirely, with nothing to say it had gone.
              - name: claim
                label: Before / after claim
                widget: object
                required: false
                collapsed: true
                fields:
                  - name: weak
                    label: Before
                    widget: object
                    fields:
                      - { name: label, widget: string }
                      - { name: text, widget: text }
                  - name: strong
                    label: After
                    widget: object
                    fields:
                      - { name: label, widget: string }
                      - { name: text, widget: text }
                  - name: caption
                    label: The note underneath
                    widget: text
                    # Optional since 18 Sep 2026, when the home page's two
                    # claims stopped deriving from each other and the note
                    # tying them together had nothing left to say. Without
                    # `required: false` the editor would refuse to save the
                    # home hero at all, because the field is now absent.
                    required: false

