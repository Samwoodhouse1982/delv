# Deploy target for delv. — see §2 of the build brief. Cloudflare Pages is the
# documented alternative; if you switch, the equivalents are a build command of
# `npm ci --omit=dev && npm run build`, an output directory of `dist`, and a
# different form backend (Netlify Forms is what the contact form posts to).

[build]
  # --omit=dev keeps Playwright out of the deploy image. It is only needed for
  # `npm run og` and `npm run a11y`, both of which run locally.
  command = "npm ci --omit=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
